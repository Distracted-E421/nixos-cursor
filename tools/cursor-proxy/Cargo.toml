[package]
name = "cursor-proxy"
version = "0.2.0"
edition = "2021"
description = "Transparent proxy for Cursor AI traffic interception and modification"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/HTTPS
hyper = { version = "1", features = ["full", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "5"
libc = "0.2"

# Optional: egui dashboard
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

[features]
default = []
egui = ["dep:eframe", "dep:egui"]

[[bin]]
name = "cursor-proxy"
path = "src/main.rs"

[lib]
name = "cursor_proxy"
path = "src/lib.rs"
